name: setd1b-rnaseq-r
channels: [conda-forge, bioconda, nodefaults]
dependencies:
  # Keep the complete Bioconductor 3.22 release family together. These builds
  # require R >=4.5 and <4.6; advancing one pin requires advancing them all.
  - r-base=4.5
  - bioconductor-deseq2=1.50.2
  - bioconductor-apeglm=1.32.0
  - bioconductor-topgo=2.62.0
  - bioconductor-org.mm.eg.db=3.22.0
  - bioconductor-annotationdbi=1.72.0
  - r-ggplot2
  - r-pheatmap
