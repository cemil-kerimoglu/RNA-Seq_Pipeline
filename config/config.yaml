project:
  name: SETD1B_neuronal_nuclear_RNAseq
  geo_accession: GSE180326
  bioproject: PRJNA747832
  sra_study: SRP328849
  samplesheet: config/samples.tsv

reference:
  species: Mus_musculus
  assembly: GRCm38
  annotation: GENCODE_M25
  fasta_url: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M25/GRCm38.primary_assembly.genome.fa.gz
  gtf_url: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M25/gencode.vM25.primary_assembly.annotation.gtf.gz
  sjdb_overhang: 74

fastp:
  qualified_quality_phred: 20
  unqualified_percent_limit: 40
  length_required: 20
  trim_poly_g: true
  detect_adapter_for_pe: false

alignment:
  star_two_pass: true
  out_filter_multimap_nmax: 10

quantification:
  # gene_body is the default because these are nuclear RNA samples and the paper
  # explicitly states that spliced and unspliced transcripts were considered.
  # The exact original featureCounts flags were not reported, so this is a
  # transparent reconstruction rather than a byte-for-byte reproduction.
  count_mode: gene_body # gene_body | exon
  strandedness: 0 # 0=unstranded, 1=forward, 2=reverse
  min_mapq: 10

differential_expression:
  reference_level: control
  test_level: cKO
  min_count_per_sample: 10
  paper_padj: 0.10
  paper_abs_fold_change: 1.20
  modern_fdr: 0.05

gene_ontology:
  ontology: BP
  node_size: 10
  paper_weight_p: 0.005
  # tested = genes that entered DESeq2 after minimal prefiltering.
  # all_annotated = closer to the paper's stated whole-genome gene universe.
  universe: tested # tested | all_annotated
